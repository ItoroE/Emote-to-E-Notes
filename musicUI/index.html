<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emotion to MIDI</title>
  <script type="module" src="update.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Emotion to Music</h1>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <div class="controls">
       <button id="resetBtn">New Session</button>
      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
    </div>

    <section class="panel">
      <h2>Emotion Output</h2>
      <pre id="emotionOutput">No data yet</pre>
    </section>

    <section class="panel">
      <h2>MIDI Output</h2>
      <p id="midiStatus">No MIDI generated yet</p>
      <audio id="audioPlayer" controls></audio>
      <p>
        <a id="midiLink" href="#" target="_blank" rel="noopener">Open generated MIDI</a>
      </p>
    </section>
  </main>
</body>
</html>
